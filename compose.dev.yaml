# Postgres alone, so WS6 and WS7 have a real database before the full stack exists.
# The full Airflow stack is WS6's docker-compose.yaml.
name: kallang-invoice-demo

services:
  postgres:
    image: postgres:16-alpine
    container_name: invoiceflow-postgres-dev
    environment:
      POSTGRES_USER: ${AP_DB_USER:-ap}
      POSTGRES_PASSWORD: ${AP_DB_PASSWORD:-change-me}
      POSTGRES_DB: ${AP_DB_NAME:-ap}
    ports:
      - "127.0.0.1:${AP_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    shm_size: 128mb
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

volumes:
  postgres-dev-data:
