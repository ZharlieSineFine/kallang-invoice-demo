# The light setup's database: Postgres alone, for the tests and for running the review app
# on the Mac without Airflow. The full Airflow stack is docker-compose.yaml.
# Named kallang-invoice-light on 2026-11-20 (was kallang-invoice-demo, container
# invoiceflow-postgres-dev); its data was copied from kallang-invoice-demo_postgres-dev-data.
name: kallang-invoice-light

services:
  postgres:
    image: postgres:16-alpine
    container_name: kallang-invoice-light-db
    environment:
      POSTGRES_USER: ${AP_DB_USER:-ap}
      POSTGRES_PASSWORD: ${AP_DB_PASSWORD:-change-me}
      POSTGRES_DB: ${AP_DB_NAME:-ap}
    ports:
      - "127.0.0.1:${AP_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    shm_size: 128mb
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
