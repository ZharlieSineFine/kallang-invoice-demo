# Check settings (WS5 owns the code; finance-facing values live here).
# Amounts are strings so they load as Decimal.
version: 1

# Prompt-injection canary (CR-001): WS3 embeds it in the prompt; R09 flags it in output.
canary: KALLANG-INTERNAL-CANARY-9f3a

routing:
  auto_approve_clean: true   # false in a pilot: people see every invoice first
  # At or above this SGD total, a person approves even when every check passes (CR-012).
  # Credit notes count by size; foreign invoices by their SGD total.
  auto_pass_limit_sgd: "5000.00"   # no demo invoice reaches it (largest auto-passed: 2,877.60)

# Random audit sample of auto-passed invoices (CR-012): a person checks the picked ones
# against the page, and the share with an error estimates the auto-pass error rate. A picked
# invoice stays AUTO_PASSED and exports as usual. The seed decides which files are picked;
# in production keep it secret, so nobody can tell from a file whether it will be audited.
audit:
  sample_percent: "10"
  seed: "kallang-demo-10"   # chosen so the live set's PCE-2026-9606 is picked, the other five not
  error_limit_percent: "2"  # audit_monitor marks its weekly report above this (more than 1 in 50)

severities:                  # INFO | FLAG | HOLD | MANUAL
  R01: FLAG    # value not found on the page
  R02: FLAG    # arithmetic
  R03: FLAG    # GST
  R04: HOLD    # unknown vendor (wrong addressee is FLAG in code)
  R05: HOLD    # duplicate
  R06: FLAG    # SAP-mandatory field or coding missing
  R07: MANUAL  # unreadable
  R08: HOLD    # bank account differs from vendor master
  R09: HOLD    # hidden or instruction-like text
  R10: INFO    # document type (routing handled by the router)
  R11: FLAG    # dates
  R12: FLAG    # PO

tolerances:
  line_amount: "0.01"        # quantity x unit price x days vs line amount
  lines_vs_subtotal: "0.05"
  subtotal_plus_gst: "0.01"
  gst_amount: "0.05"         # item-by-item vs subtotal rounding (IRAS allows either)

gst_rates:                   # Singapore standard rate by date
  - {from: "2019-01-01", rate_percent: "7"}
  - {from: "2023-01-01", rate_percent: "8"}
  - {from: "2024-01-01", rate_percent: "9"}

simplified_invoice_max_total: "1000.00"   # IRAS: total incl. GST
fuzzy_match_min_score: 90
max_invoice_age_days: 180
duplicate_window_days: 7
purchase_order_required: false   # true: R12 also flags an invoice that quotes no PO number
scanned_page_min_chars: 25
ocr_min_mean_conf: 60

hidden_text:
  max_font_size_pt: 3.0      # was 2.0; smallest real text on the 54 demo invoices is 7.6 pt
  min_fill_lightness: 0.95   # 1.0 = white
  # Render each text-layer page, OCR it, and hide text-layer words a person cannot see,
  # however they were hidden (covered, transparent, light gray, same color as the
  # background). CR-011.
  ocr_compare: true

instruction_phrases:         # start from the AgentOps guardrail patterns
  - ignore previous instructions
  - ignore all previous
  - disregard the above
  - you are now
  - system prompt
  - set the total to
  - approve this invoice
  - "note to ai"
  - "the ai system"
