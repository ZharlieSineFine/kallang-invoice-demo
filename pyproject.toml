[project]
name = "invoiceflow"
version = "0.1.0"
description = "Kallang Track 10 local demo: invoice intake, checks, review, and SAP CSV export"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Every dependency any workstream needs is declared here in Phase 0, so no
# workstream edits this file. Ask through docs/contract-requests.md instead.
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
  "rapidfuzz>=3.10",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "pytesseract>=0.3.13",
  "pillow>=10.4",
  "httpx>=0.27",
  "openai>=1.50",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# WS1: synthetic invoices (WeasyPrint needs Pango: brew install pango)
generator = ["jinja2>=3.1", "weasyprint>=62", "faker>=30", "augraphy>=8.2"]
# WS7: review app and dashboard
app = ["streamlit>=1.40", "pandas>=2.2"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoiceflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "ollama: needs a running Ollama server with the configured model",
  "db: needs the dev Postgres (make db-dev) and AP_DATABASE_URL",
  "docker: needs Docker",
]

[tool.coverage.run]
source = ["invoiceflow"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
